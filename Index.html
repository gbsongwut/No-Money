function analyzeStocks(){

const raw=document.getElementById("tickerInput").value.trim();

if(!raw){
alert("กรุณากรอก ticker");
return;
}

const tickers=raw
.split(",")
.map(x=>x.trim().toUpperCase());

document.getElementById("tableArea").innerHTML =
"<div class='loading'>กำลังวิเคราะห์...</div>";

setTimeout(()=>renderAnalysis(tickers),800);
}

function renderAnalysis(tickers){

let valid=tickers.filter(t=>stockDB[t]);

if(valid.length===0){
document.getElementById("tableArea").innerHTML=
"ไม่พบข้อมูลหุ้น";
return;
}

const groups={};

valid.forEach(t=>{
const sec=stockDB[t].sector;
if(!groups[sec]) groups[sec]=[];
groups[sec].push(t);
});

let html="";

for(let sector in groups){

```
const list=groups[sector];

const metrics=
  Object.keys(stockDB[list[0]].ratios);

html+=`
  <h3>${sector}
  <span class="badge">${list.length} stocks</span>
  </h3>
  <table>
    <tr>
      <th>Ratio</th>
      ${list.map(x=>`<th>${x}</th>`).join("")}
    </tr>
`;

metrics.forEach(m=>{
  html+=`
  <tr>
    <td>${m}</td>
    ${list.map(t=>
      `<td>${stockDB[t].ratios[m]||"-"}</td>`
    ).join("")}
  </tr>`;
});

html+="</table><br>";
```

}

document.getElementById("tableArea").innerHTML=html;

renderSummary(valid);
renderSuggestion(valid);
}

function renderSummary(list){

let html="";

list.forEach(t=>{
html+=      `<div class="summary-card">         <strong>${t}</strong><br>         ${stockDB[t].summary}       </div>`    ;
});

document.getElementById("summaryArea").innerHTML=html;
}

function renderSuggestion(list){

let txt="";

if(list.includes("PTT"))
txt+="• เหมาะสำหรับสายปันผลและถือระยะยาว<br>";

if(list.includes("CPALL"))
txt+="• เหมาะสำหรับ defensive growth<br>";

if(list.includes("KBANK"))
txt+="• เหมาะสำหรับ value play + dividend<br>";

if(list.includes("GULF"))
txt+="• เหมาะสำหรับนักลงทุนรับความผันผวนได้สูง<br>";

txt+="<br><strong>ควรกระจายความเสี่ยงระหว่างหลาย sector</strong>";

document.getElementById("suggestionArea").innerHTML=txt;
}
